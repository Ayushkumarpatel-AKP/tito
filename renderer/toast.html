<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Tito</title>
<link rel="stylesheet" href="clay.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  #wrap { position: absolute; right: 10px; bottom: 6px; width: 290px; height: 250px; cursor: pointer; }
  #bubble { position: absolute; left: 0; right: 0; top: 0; padding: 12px 16px; font-weight: 700; font-size: 14.5px; line-height: 1.3; border-radius: 22px 22px 22px 8px; animation: popin .6s var(--spring) both .25s; }
  #pet { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; }
  #wrap.out { animation: out .4s ease-in both; }
  @keyframes out { to { opacity: 0; transform: translateY(40px) scale(.85); } }
</style>
</head>
<body>
  <div id="wrap" class="pop-in">
    <div id="bubble" class="clay"></div>
    <div id="pet" class="pet"><div class="shadow"></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="../assets/tito/manifest.js"></script>
  <script src="sprite.js"></script>
  <script src="toast.js"></script>
</body>
</html>
